name: Build APK
on:
  push:
    paths: ['app.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Unzip project
        run: unzip -q app.zip -d proj
      - name: Install Gradle 8.14.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.14.2/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: notifyIOS27-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "notifyIOS27 build ${{ github.run_number }}" --notes "Debug APK"

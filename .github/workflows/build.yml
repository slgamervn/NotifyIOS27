name: Build APK

on:
  push:
    paths: ['app.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 1. Cài đặt Java (Bắt buộc cho Android project)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Cài đặt Android SDK (Bắt buộc để Gradle biên dịch Android)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: unzip -q app.zip -d proj

      - name: Restore fixed debug key (keeps updates installable)
        run: |
          if [ -f debug.keystore.b64 ]; then
            mkdir -p "$HOME/.android"
            base64 -d debug.keystore.b64 > "$HOME/.android/debug.keystore"
          fi

      - name: Install Gradle 8.14.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.14.2/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: notifyIOS27-apk
          path: proj/app/build/outputs/apk/debug/notifyIOS27-debug.apk

      - name: Build release APK (same fixed key, not debuggable)
        id: rel
        continue-on-error: true
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: steps.rel.outcome == 'success'
        with:
          name: notifyIOS27-apk-release
          path: proj/app/build/outputs/apk/release/notifyIOS27.apk

      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="proj/app/build/outputs/apk/debug/notifyIOS27-debug.apk"
          if [ -f proj/app/build/outputs/apk/release/notifyIOS27.apk ]; then 
            FILES="$FILES proj/app/build/outputs/apk/release/notifyIOS27.apk"
          fi
          gh release create "build-${{ github.run_number }}" $FILES --title "notifyIOS27 build ${{ github.run_number }}" --notes "Debug and release APK"

name: Build APK

on:
  push:
    branches: [main, dev]
    paths:
      - app.zip
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (main branch only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: notifyios27-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      publish_release: ${{ steps.publication.outputs.publish_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s app.zip || { echo "::error::app.zip is missing or empty"; exit 1; }
          mkdir -p proj
          unzip -q app.zip -d proj
          test -d proj/app || { echo "::error::The archive must contain an app/ Gradle module"; exit 1; }

      - name: Restore the existing signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_B64=""
          for candidate in .android/debug.keystore.b64 .android/debug.keystore/debug.keystore.b64 debug.keystore.b64; do
            if [ -s "$candidate" ]; then
              KEY_B64="$candidate"
              break
            fi
          done
          if [ -z "$KEY_B64" ]; then
            echo "::error::The established signing key is missing. Refusing to generate a new key because installed copies would no longer accept updates."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          base64 --decode "$KEY_B64" > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          if keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android > "$RUNNER_TEMP/debug-keystore-info.txt" 2>&1; then
            grep -E 'Alias name:|SHA256:' "$RUNNER_TEMP/debug-keystore-info.txt" || true
          else
            echo "::warning::Could not inspect the restored debug keystore with the default Android debug password."
          fi
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$HOME" >> "$GITHUB_ENV"
          echo "Restored the existing app-signing identity and pinned the Android SDK user-config directory."

      - name: Install verified Gradle 8.14.2
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.14.2"
          GRADLE_SHA256="7197a12f450794931532469d4ff21a59ea2c1cd59a3ec3f89c035c3c420a6999"
          curl --fail --location --silent --show-error "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
          echo "${GRADLE_SHA256}  gradle.zip" | sha256sum --check -
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Report Android variant signing configuration
        working-directory: proj
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-unset}"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-unset}"
          gradle signingReport --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          mapfile -t DEBUG_APKS < <(find proj/app/build/outputs/apk/debug -type f -name '*.apk' -print)
          mapfile -t RELEASE_APKS < <(find proj/app/build/outputs/apk/release -type f -name '*.apk' -print)

          if [ "${#DEBUG_APKS[@]}" -ne 1 ]; then
            printf 'Expected exactly one debug APK; found %s\n' "${#DEBUG_APKS[@]}"
            printf '%s\n' "${DEBUG_APKS[@]}"
            exit 1
          fi
          if [ "${#RELEASE_APKS[@]}" -ne 1 ]; then
            printf 'Expected exactly one release APK; found %s\n' "${#RELEASE_APKS[@]}"
            printf '%s\n' "${RELEASE_APKS[@]}"
            exit 1
          fi

          install -m 0644 "${DEBUG_APKS[0]}" dist/notifyIOS27-debug.apk
          install -m 0644 "${RELEASE_APKS[0]}" dist/notifyIOS27-release.apk
          test -s dist/notifyIOS27-debug.apk
          test -s dist/notifyIOS27-release.apk

      - name: Reject signing stores embedded in app archive
        shell: bash
        run: |
          set -euo pipefail

          find_signing_store_files() {
            local root="$1"
            find "$root" -type f \( -iname '*.jks*' -o -iname '*.keystore*' -o -iname '*.p12*' -o -iname '*.pfx*' \) -print | sort -u
          }

          # Verify the filename detector with synthetic fixtures.
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/nested"
          : > "$fixture/nested/fake-release.keystore.b64"
          : > "$fixture/nested/fake-upload.p12"
          fixture_findings="$(find_signing_store_files "$fixture")"
          if ! printf '%s\n' "$fixture_findings" | grep -Fq 'fake-release.keystore.b64' ||
             ! printf '%s\n' "$fixture_findings" | grep -Fq 'fake-upload.p12'; then
            echo "::error::Signing-store detector self-test failed."
            exit 1
          fi
          echo "Signing-store detector self-test passed."

          source_findings="$(find_signing_store_files proj)"
          if [ -n "$source_findings" ]; then
            echo "::error::Signing stores must not be embedded in app.zip. Detected paths:"
            printf '%s\n' "$source_findings"
            exit 1
          fi
          echo "No signing-store files found inside the extracted app archive."

          echo "Gradle files containing signing configuration (paths only):"
          grep -RIlE 'signingConfig|storeFile|keyAlias|storePassword|keyPassword' proj --include='*.gradle' --include='*.gradle.kts' --exclude-dir=.gradle || true

      - name: Verify APK signatures and update continuity
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK build-tools were not found on the runner."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "::error::apksigner or aapt is missing from Android build-tools."
            exit 1
          fi

          read_manifest_value() {
            local badging="$1"
            local field="$2"
            case "$field" in
              name) printf '%s\n' "$badging" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1 ;;
              versionCode) printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1 ;;
              versionName) printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" | head -n 1 ;;
              *) return 1 ;;
            esac
          }

          verify_track() {
            local track="$1"
            local apk="$2"
            local asset_name="$3"
            local previous_dir="previous/$track"

            echo "::group::Verify $track APK"
            "$APKSIGNER" verify --verbose "$apk"
            local certificate_output
            certificate_output="$("$APKSIGNER" verify --print-certs "$apk" 2>&1)"
            printf '%s\n' "$certificate_output"
            local certificate
            certificate="$(printf '%s\n' "$certificate_output" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
            if [ -z "$certificate" ]; then
              echo "::error::$track APK has no readable SHA-256 signing-certificate fingerprint."
              exit 1
            fi

            local badging
            badging="$("$AAPT" dump badging "$apk")"
            local app_id
            local version_code
            local version_name
            app_id="$(read_manifest_value "$badging" name)"
            version_code="$(read_manifest_value "$badging" versionCode)"
            version_name="$(read_manifest_value "$badging" versionName)"

            if [ -z "$app_id" ] || [ -z "$version_code" ] || [ -z "$version_name" ]; then
              echo "::error::Could not read $track APK package metadata."
              exit 1
            fi
            if ! [[ "$version_code" =~ ^[0-9]+$ ]] || [ "$version_code" -lt 1 ]; then
              echo "::error::$track APK versionCode is invalid: $version_code"
              exit 1
            fi

            printf '%s\n' "$badging" | grep '^package:' || true
            echo "$track applicationId: $app_id"
            echo "$track versionCode: $version_code"
            echo "$track versionName: $version_name"
            echo "$track signingCertificateSha256: $certificate"

            if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              mkdir -p "$previous_dir"
              if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern "$asset_name" --dir "$previous_dir"; then
                echo "::error::Could not download the previous $track APK for update-compatibility verification."
                exit 1
              fi

              local previous_apk="$previous_dir/$asset_name"
              if [ ! -s "$previous_apk" ]; then
                echo "::error::The previous $track APK asset is missing or empty."
                exit 1
              fi

              "$APKSIGNER" verify --verbose "$previous_apk"
              local previous_certificate_output
              previous_certificate_output="$("$APKSIGNER" verify --print-certs "$previous_apk" 2>&1)"
              local previous_certificate
              previous_certificate="$(printf '%s\n' "$previous_certificate_output" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
              local previous_badging
              previous_badging="$("$AAPT" dump badging "$previous_apk")"
              local previous_app_id
              local previous_version_code
              previous_app_id="$(read_manifest_value "$previous_badging" name)"
              previous_version_code="$(read_manifest_value "$previous_badging" versionCode)"

              if [ -z "$previous_certificate" ] || [ -z "$previous_app_id" ] ||
                 ! [[ "$previous_version_code" =~ ^[0-9]+$ ]]; then
                echo "::error::Could not verify the previously published $track APK metadata."
                exit 1
              fi
              printf '%s\\n' "$previous_badging" | grep '^package:' || true
              echo "$track previous applicationId: $previous_app_id"
              echo "$track previous versionCode: $previous_version_code"
              echo "$track previous signingCertificateSha256: $previous_certificate"

              if [ "$app_id" != "$previous_app_id" ]; then
                echo "::error::$track applicationId changed from $previous_app_id to $app_id. Existing installations would not update in place."
                exit 1
              fi
              if [ "$certificate" != "$previous_certificate" ]; then
                echo "::error::$track signing certificate changed (current: $certificate; previous: $previous_certificate). Refusing to publish an in-place update with a different certificate. A reviewed signing-lineage or new-package migration must be implemented separately."
                exit 1
              fi
              if [ "$version_code" -le "$previous_version_code" ]; then
                echo "::error::$track versionCode ($version_code) must be higher than the latest published version ($previous_version_code)."
                exit 1
              fi

              echo "$track update compatibility: passed (applicationId and signing certificate unchanged; versionCode increased)."
            else
              echo "No previous public Release exists; first-release continuity check skipped."
            fi

            {
              echo "### $track APK"
              echo "- applicationId: $app_id"
              echo "- versionCode: $version_code"
              echo "- versionName: $version_name"
              echo "- signingCertificateSha256: $certificate"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          }

          # Debug and release are separate installation tracks. They may use
          # different certificates, so compare each only with its own previous APK.
          verify_track "Debug" "dist/notifyIOS27-debug.apk" "notifyIOS27-debug.apk"
          verify_track "Release" "dist/notifyIOS27-release.apk" "notifyIOS27-release.apk"

      - name: Generate APK checksums and update metadata
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum notifyIOS27-debug.apk notifyIOS27-release.apk > SHA256SUMS.txt
          )

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK build-tools were not found while generating update metadata."
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "::error::aapt is missing; cannot read release APK version metadata."
            exit 1
          fi
          "$AAPT" dump badging dist/notifyIOS27-release.apk > "$RUNNER_TEMP/notifyios27-release-badging.txt"
          python3 - "$RUNNER_TEMP/notifyios27-release-badging.txt" "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          badging = Path(sys.argv[1]).read_text(encoding="utf-8")
          repository = sys.argv[2]
          run_number = sys.argv[3]
          if not run_number.isdigit() or int(run_number) < 1:
              raise SystemExit("Invalid GitHub Actions run number for the Release tag")
          release_tag = f"build-{int(run_number)}"
          version_code_match = re.search(r"versionCode=\x27([^\x27]+)\x27", badging)
          version_name_match = re.search(r"versionName=\x27([^\x27]+)\x27", badging)
          if not version_code_match or not version_code_match.group(1).isdigit() or not version_name_match:
              raise SystemExit("Could not extract versionCode/versionName from the release APK")

          version_code = int(version_code_match.group(1))
          version_name = version_name_match.group(1)
          payload = {
              "versionCode": version_code,
              "versionName": version_name,
              "url": f"https://github.com/{repository}/releases/download/{release_tag}/notifyIOS27-release.apk",
              "notes": f"Bản mới nhất {version_name}. Tải và cài trực tiếp.",
              "force": False,
          }
          Path("dist/notifyIOS27-update.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m json.tool dist/notifyIOS27-update.json > /dev/null
          python3 - "$RUNNER_TEMP/notifyios27-release-badging.txt" "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" dist/notifyIOS27-update.json <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          badging = Path(sys.argv[1]).read_text(encoding="utf-8")
          repository = sys.argv[2]
          run_number = sys.argv[3]
          metadata_path = Path(sys.argv[4])
          if not run_number.isdigit() or int(run_number) < 1:
              raise SystemExit("Invalid run number")
          package_match = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
          code_match = re.search(r"versionCode='([0-9]+)'", badging)
          name_match = re.search(r"versionName='([^']+)'", badging)
          if not package_match or not code_match or not name_match:
              raise SystemExit("Release APK manifest metadata is incomplete")

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          expected_url = (
              f"https://github.com/{repository}/releases/download/"
              f"build-{int(run_number)}/notifyIOS27-release.apk"
          )
          expected = {
              "versionCode": int(code_match.group(1)),
              "versionName": name_match.group(1),
              "url": expected_url,
              "force": False,
          }
          for field, expected_value in expected.items():
              if metadata.get(field) != expected_value:
                  raise SystemExit(f"Update metadata mismatch: {field}")
          if not re.fullmatch(
              r"https://github\\.com/slgamervn/NotifyIOS27/releases/download/"
              r"build-[1-9][0-9]*/notifyIOS27-release\\.apk",
              metadata["url"],
          ):
              raise SystemExit("Update APK URL does not match the strict release URL format")
          print("Update metadata validation passed: package/version and tag-pinned APK URL match the built release APK.")

          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notifyIOS27-apks-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Decide whether this run may publish
        id: publication
        shell: bash
        env:
          PUBLISH_RELEASE_INPUT: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          PUBLISH="false"

          if [ "$GITHUB_EVENT_NAME" = "push" ] &&
             [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" -- app.zip | grep -Fxq 'app.zip'; then
              PUBLISH="true"
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
               [ "$GITHUB_REF" = "refs/heads/main" ] &&
               [ "$PUBLISH_RELEASE_INPUT" = "true" ]; then
            PUBLISH="true"
          fi


          tracked_signing_files() {
            git ls-files | grep -Ei '(^|/)(debug\.keystore(\.b64)?|[^/]+\.(jks|keystore|p12|pfx)(\.b64)?)$' || true
          }

          assert_safe_to_publish() {
            local tracked
            tracked="$(tracked_signing_files)"
            if [ -n "$tracked" ]; then
              echo "Tracked signing material detected:" >&2
              printf '%s\n' "$tracked" >&2
              return 1
            fi
            return 0
          }

          if [ "$PUBLISH" = "true" ]; then
            if ! assert_safe_to_publish; then
              echo "::error::Release publication is blocked while signing keystore material is tracked in this repository. Treat the public key as compromised and prepare the private-key/new-package migration before publishing."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            if assert_safe_to_publish; then
              echo "::error::Publication guard self-test failed: expected tracked signing material to block a simulated publication."
              exit 1
            else
              echo "Publication guard self-test passed: tracked signing material is rejected without publishing a Release."
            fi
          fi

          echo "publish_release=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ]; then
            echo "This main-branch run is allowed to publish a GitHub Release."
          else
            echo "Build-only run: no public GitHub Release will be created."
          fi

  publish:
    name: publish
    needs: build
    if: needs.build.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: notifyIOS27-apks-${{ github.run_number }}
          path: release

      - name: Publish or update this run's release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-${RUN_NUMBER}"
          TITLE="NotifyIOS27 build ${RUN_NUMBER}"
          NOTES="Automated APK build from commit ${COMMIT_SHA}.\n\nThe workflow verifies each APK against its own previously published variant. Debug and release APKs may use different signing certificates; do not switch an installed app between variants.\n\nFiles:\n- notifyIOS27-release.apk: release build\n- notifyIOS27-debug.apk: debug build\n- SHA256SUMS.txt: SHA-256 checksums\n- notifyIOS27-update.json: verified app version metadata for the website and in-app updater\n\nInstall updates only when the installed app ID and signing identity match and the new versionCode is not lower."

          test -s release/notifyIOS27-debug.apk
          test -s release/notifyIOS27-release.apk
          test -s release/SHA256SUMS.txt
          test -s release/notifyIOS27-update.json
          python3 -m json.tool release/notifyIOS27-update.json > /dev/null
          (cd release && sha256sum --check SHA256SUMS.txt)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/notifyIOS27-debug.apk release/notifyIOS27-release.apk release/SHA256SUMS.txt release/notifyIOS27-update.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/notifyIOS27-debug.apk release/notifyIOS27-release.apk release/SHA256SUMS.txt release/notifyIOS27-update.json --title "$TITLE" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi

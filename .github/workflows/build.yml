name: Build APK
on:
  push:
    paths: ['app.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Unzip project
        run: unzip -q app.zip -d proj
      - name: Restore fixed debug key (keeps updates installable)
        run: |
          KEY_B64=""
          if [ -f .android/debug.keystore.b64 ]; then
            KEY_B64=".android/debug.keystore.b64"
          elif [ -f .android/debug.keystore/debug.keystore.b64 ]; then
            KEY_B64=".android/debug.keystore/debug.keystore.b64"
          elif [ -f debug.keystore.b64 ]; then
            KEY_B64="debug.keystore.b64"
          fi
          if [ -n "$KEY_B64" ]; then
            mkdir -p "$HOME/.android"
            base64 -d "$KEY_B64" > "$HOME/.android/debug.keystore"
            echo "Restored keystore from $KEY_B64"
          else
            echo "Warning: no debug.keystore.b64 found"
          fi
      - name: Install Gradle 8.14.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.14.2/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: notifyIOS27-apk
          path: proj/app/build/outputs/apk/debug/notifyIOS27-debug.apk
      - name: Build release APK (same fixed key, not debuggable)
        id: rel
        continue-on-error: true
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        if: steps.rel.outcome == 'success'
        with:
          name: notifyIOS27-apk-release
          path: proj/app/build/outputs/apk/release/notifyIOS27-release.apk
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="proj/app/build/outputs/apk/debug/notifyIOS27-debug.apk"
          if [ -f proj/app/build/outputs/apk/release/notifyIOS27-release.apk ]; then FILES="$FILES proj/app/build/outputs/apk/release/notifyIOS27-release.apk"; fi
          gh release create "build-${{ github.run_number }}" $FILES --title "notifyIOS27 build ${{ github.run_number }}" --notes "Debug and release APK"

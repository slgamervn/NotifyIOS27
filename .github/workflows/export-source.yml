name: Temporary source snapshot export

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate source archive
        run: |
          set -euo pipefail
          test -s app.zip
          unzip -t app.zip >/dev/null
          echo "Source archive integrity passed."
      - name: Upload temporary source snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notifyios27-source-snapshot-${{ github.run_number }}
          path: app.zip
          if-no-files-found: error
          retention-days: 1
